[project]
id = "pulse-heart-share"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost"
smtp_addr = ""
smtp_port = ""
smtp_user = ""
smtp_pass = ""
smtp_admin_email = ""
sender_name = "Pulse Heart Share"
sender_email = "noreply@pulseheartshare.com"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enabled = false
provider = "twilio"
twilio_account_sid = ""
twilio_auth_token = ""
twilio_message_service_sid = ""
sms_autoconfirm = true

[auth.email]
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

[auth.external.email]
enabled = true

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[realtime]
enabled = true
max_connections = 200
